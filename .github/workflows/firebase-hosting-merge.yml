# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - run: bun install

      - name: Bump version
        run: node scripts/bump-version.cjs

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .env.public
          if git diff --staged --quiet; then
            echo "No version changes to commit"
          else
            git commit -m "chore: bump version [skip ci]"
            git push
          fi

      - run: bun run build
        env:
          VITE_PUBLIC_POSTHOG_KEY: ${{ secrets.VITE_PUBLIC_POSTHOG_KEY }}
          VITE_PUBLIC_POSTHOG_HOST: ${{ secrets.VITE_PUBLIC_POSTHOG_HOST }}

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BAILAPP_POLTHM }}
          channelId: live
          projectId: bailapp-polthm

      # Hosting alone is not the whole deploy: the app depends on Firestore
      # rules, indexes and Storage rules that live in this repo too. Shipping
      # code without them leaves production running against stale rules, which
      # fails at runtime with no build error to point at it.
      - name: Check whether rules or indexes changed
        id: rules_changed
        run: |
          if git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" \
            | grep -qE '^(firestore\.rules|storage\.rules|firestore\.indexes\.json)$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy Firestore and Storage rules
        if: steps.rules_changed.outputs.changed == 'true'
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/service-account.json"
          bunx firebase-tools deploy \
            --only firestore:rules,firestore:indexes,storage \
            --project bailapp-polthm \
            --non-interactive
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BAILAPP_POLTHM }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/service-account.json
